<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Превью для Telegram -->
    <meta property="og:title" content="Купишь мне шашлык? 🍖">
    <meta property="og:description" content="Открой ссылку, тут серьезный вопрос...">
    <meta property="og:type" content="website">

    <title>Купишь мне шашлык</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .hint-text {
            color: #d32f2f;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
            display: none;
        }

        .buttons-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            min-height: 220px;
        }

        /* Стильные современные кнопки */
        .btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 85%;
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Цвета кнопок */
        .btn-green {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-blue {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
        }

        .btn-red {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
        }

        .hidden-screen {
            display: none;
        }

        .math-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            border: 1px solid #e9ecef;
        }

        .math-input {
            width: 80%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 12px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .submit-btn {
            background: #2c3e50;
            color: white;
            width: 85%;
        }

        /* Чистая желтая кнопка Яндекса */
        .yandex-link {
            display: inline-block;
            padding: 18px 45px;
            background-color: #fff400;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(255, 244, 0, 0.45);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }

        .yandex-link:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container" id="mainContainer">
        <!-- ЭКРАН 1: Главный вопрос -->
        <div id="screenQuestion" style="width: 100%;">
            <h1 id="mainTitle">Купишь мне шашлык</h1>
            <div id="notSoEasyText" class="hint-text">Не всё так просто... Всё-таки нажми ДА! 😈</div>
            <div class="buttons-area">
                <!-- Кнопки первого этапа -->
                <button id="yesBtn1" class="btn btn-green">Да</button>
                <button id="yesBtn2" class="btn btn-blue">Да, куплю</button>
                <button id="noBtnTrigger" class="btn btn-red">Нажми чтобы выбрать нет</button>

                <!-- Новые кнопки для второго этапа -->
                <button id="trickYesBtn" class="btn btn-green" style="display: none;">Да</button>
                <button id="trickNoBtn" class="btn btn-red" style="display: none;">Нет</button>
            </div>
        </div>

        <!-- ЭКРАН 2: Логарифм -->
        <div id="screenMath" style="width: 100%;" class="hidden-screen">
            <h1>Реши задачу 🧐</h1>
            <div class="math-box">log₂ (16) = ?</div>
            <input type="number" id="mathAnswer" class="math-input" placeholder="Введите ответ">
            <button id="checkAnswerBtn" class="btn submit-btn">Проверить</button>
        </div>

        <!-- ЭКРАН 3: Чистый финал с прямой ссылкой на Яндекс Еду -->
        <div id="screenSuccess" class="hidden-screen">
            <a href="https://eda.yandex.ru/" target="_blank" class="yandex-link">Выбрать в Яндекс Еде 💛</a>
        </div>
    </div>

    <script>
        const yesBtn1 = document.getElementById('yesBtn1');
        const yesBtn2 = document.getElementById('yesBtn2');
        const noBtnTrigger = document.getElementById('noBtnTrigger');

        const trickYesBtn = document.getElementById('trickYesBtn');
        const trickNoBtn = document.getElementById('trickNoBtn');

        const screenQuestion = document.getElementById('screenQuestion');
        const screenMath = document.getElementById('screenMath');
        const screenSuccess = document.getElementById('screenSuccess');
        const notSoEasyText = document.getElementById('notSoEasyText');
        const mainTitle = document.getElementById('mainTitle');
        const mainContainer = document.getElementById('mainContainer');

        const mathAnswer = document.getElementById('mathAnswer');
        const checkAnswerBtn = document.getElementById('checkAnswerBtn');

        let yesScale = 1.0;
        let noScale = 1.0;
        let noOpacity = 1.0;

        function openSuccess() {
            screenQuestion.style.display = 'none';
            screenSuccess.style.display = 'block';
            mainContainer.style.width = '100%';
            mainContainer.style.maxWidth = '420px';
            mainContainer.style.height = 'auto';
            mainContainer.style.padding = '30px';
        }

        yesBtn1.addEventListener('click', openSuccess);
        yesBtn2.addEventListener('click', openSuccess);
        trickYesBtn.addEventListener('click', openSuccess);

        noBtnTrigger.addEventListener('click', () => {
            screenQuestion.style.display = 'none';
            screenMath.style.display = 'block';
        });

        checkAnswerBtn.addEventListener('click', () => {
            const answer = mathAnswer.value.trim();
            if (answer === '4') {
                screenMath.style.display = 'none';
                screenQuestion.style.display = 'block';

                mainTitle.style.display = 'none';
                yesBtn1.style.display = 'none';
                yesBtn2.style.display = 'none';
                noBtnTrigger.style.display = 'none';

                notSoEasyText.style.display = 'block';
                trickYesBtn.style.display = 'block';
                trickNoBtn.style.display = 'block';
            } else {
                alert('Неправильно! Попробуй еще раз 🎯');
            }
        });

        function growYesButton(e) {
            if (e) e.preventDefault();

            yesScale += 0.35;
            noScale -= 0.15;
            noOpacity -= 0.2;

            if (noScale <= 0.3) {
                trickNoBtn.style.display = 'none';
            } else {
                trickNoBtn.style.transform = `scale(${noScale})`;
                trickNoBtn.style.opacity = noOpacity;
            }

            trickYesBtn.style.transform = `scale(${yesScale})`;

            if (yesScale > 2.0) {
                mainContainer.style.maxWidth = '100vw';
                mainContainer.style.width = '90%';
            }
        }

        trickNoBtn.addEventListener('click', growYesButton);
        trickNoBtn.addEventListener('touchstart', growYesButton, { passive: false });
    </script>

</body>

</html>
