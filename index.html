<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Превью для Telegram -->
    <meta property="og:title" content="Купишь мне шашлык? 🍖">
    <meta property="og:description" content="Открой ссылку, тут серьезный вопрос...">
    <meta property="og:type" content="website">

    <title>Купишь мне шашлык</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .hint-text {
            color: #d32f2f;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
            display: none;
        }

        /* Область для позиционирования кнопок */
        .buttons-area {
            position: relative;
            height: 320px;
            width: 100%;
        }

        /* Стильные современные кнопки */
        .btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 85%;
        }

        /* Кнопки ДА (зеленая и синяя) */
        .btn-yes-green {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-yes-blue {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
        }

        /* Кнопка НЕТ (красная) */
        .btn-no {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
        }

        .btn:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        /* Позиции для первого экрана */
        #yesBtn1 {
            position: absolute;
            left: 50%;
            top: 10px;
            transform: translateX(-50%);
        }

        #yesBtn2 {
            position: absolute;
            left: 50%;
            top: 85px;
            transform: translateX(-50%);
        }

        #noBtnTrigger {
            position: absolute;
            left: 50%;
            top: 170px;
            transform: translateX(-50%);
        }

        /* Кнопки-обманщицы (для второго экрана) */
        #trickYesBtn {
            display: none;
            position: absolute;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
        }

        #trickNoBtn {
            display: none;
            position: absolute;
            left: 50%;
            top: 130px;
            transform: translateX(-50%);
            touch-action: none;
            /* Отключает стандартные жесты на мобилках */
        }

        .hidden-screen {
            display: none;
        }

        .math-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            border: 1px solid #e9ecef;
        }

        .math-input {
            width: 80%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 12px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .math-input:focus {
            border-color: #38ef7d;
        }

        .submit-btn {
            background: #2c3e50;
            color: white;
            width: 85%;
        }

        /* Желтая кнопка Яндекса на чистом экране */
        .yandex-link {
            display: inline-block;
            padding: 18px 45px;
            background-color: #fff400;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(255, 244, 0, 0.45);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .yandex-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 244, 0, 0.6);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- ЭКРАН 1: Главный вопрос -->
        <div id="screenQuestion">
            <h1 id="mainTitle">Купишь мне шашлык</h1>
            <div id="notSoEasyText" class="hint-text">Не всё так просто... Всё-таки нажми ДА! 😈</div>
            <div class="buttons-area">
                <!-- Кнопки первого экрана -->
                <button id="yesBtn1" class="btn btn-yes-green">Да</button>
                <button id="yesBtn2" class="btn btn-yes-blue">Да, куплю</button>
                <button id="noBtnTrigger" class="btn btn-no">Нажми чтобы выбрать нет</button>

                <!-- Кнопки-обманщицы для второго экрана -->
                <button id="trickYesBtn" class="btn btn-yes-green">Да</button>
                <button id="trickNoBtn" class="btn btn-no">Нет</button>
            </div>
        </div>

        <!-- ЭКРАН 2: Логарифм -->
        <div id="screenMath" class="hidden-screen">
            <h1>Реши задачу 🧐</h1>
            <div class="math-box">log₂ (16) = ?</div>
            <input type="number" id="mathAnswer" class="math-input" placeholder="Введите ответ">
            <button id="checkAnswerBtn" class="btn submit-btn">Проверить</button>
        </div>

        <!-- ЭКРАН 3: Чистый финал с Яндекс Едой -->
        <div id="screenSuccess" class="hidden-screen">
            <a href="https://google.com" target="_blank" class="yandex-link">Выбрать в Яндекс Еде 💛</a>
        </div>
    </div>

    <script>
        const yesBtn1 = document.getElementById('yesBtn1');
        const yesBtn2 = document.getElementById('yesBtn2');
        const noBtnTrigger = document.getElementById('noBtnTrigger');

        const trickYesBtn = document.getElementById('trickYesBtn');
        const trickNoBtn = document.getElementById('trickNoBtn');

        const screenQuestion = document.getElementById('screenQuestion');
        const screenMath = document.getElementById('screenMath');
        const screenSuccess = document.getElementById('screenSuccess');
        const notSoEasyText = document.getElementById('notSoEasyText');
        const mainTitle = document.getElementById('mainTitle');

        const mathAnswer = document.getElementById('mathAnswer');
        const checkAnswerBtn = document.getElementById('checkAnswerBtn');

        // Флаг текущего положения кнопок-обманщиц (false - стандартно, true - поменялись местами)
        let isSwapped = false;

        // Переход на финал при нажатии на любую кнопку согласия
        function openSuccess() {
            screenQuestion.style.display = 'none';
            screenSuccess.style.display = 'block';
        }

        yesBtn1.addEventListener('click', openSuccess);
        yesBtn2.addEventListener('click', openSuccess);
        trickYesBtn.addEventListener('click', openSuccess);

        // Нажатие на "Нажми чтобы выбрать нет" -> переход к логарифму
        noBtnTrigger.addEventListener('click', () => {
            screenQuestion.style.display = 'none';
            screenMath.style.display = 'block';
        });

        // Проверка логарифма
        checkAnswerBtn.addEventListener('click', () => {
            const answer = mathAnswer.value.trim();
            if (answer === '4') {
                screenMath.style.display = 'none';
                screenQuestion.style.display = 'block';

                // Скрываем старые элементы первого экрана
                mainTitle.style.display = 'none';
                yesBtn1.style.display = 'none';
                yesBtn2.style.display = 'none';
                noBtnTrigger.style.display = 'none';

                // Включаем режим обманщика: текст и новые две кнопки
                notSoEasyText.style.display = 'block';
                trickYesBtn.style.display = 'block';
                trickNoBtn.style.display = 'block';
            } else {
                alert('Неправильно! Попробуй еще раз 🎯');
            }
        });

        // Функция изменения мест для кнопок-обманщиц
        function swapButtons(e) {
            if (e) e.preventDefault(); // Важно для мобилок, чтобы не срабатывал ложный клик

            if (!isSwapped) {
                // Меняем координаты (Нет встает наверх, Да опускается вниз)
                trickNoBtn.style.top = '40px';
                trickYesBtn.style.top = '130px';
                isSwapped = true;
            } else {
                // Возвращаем обратно
                trickNoBtn.style.top = '130px';
                trickYesBtn.style.top = '40px';
                isSwapped = false;
            }
        }

        // Срабатывает на ПК при наведении мыши на "Нет"
